<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Битва Стихий — Огонь, Вода, Ветер</title>
<meta name="description" content="Тактический файтинг на стихиях: собери цепочку из пяти заклинаний и пройди Башню Трёх Стихий.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/game-menu.css?v=1">
<link rel="stylesheet" href="./styles/game.css?v=2">


</head>
<body>

<a class="game-home-menu" href="/">НА ГЛАВНУЮ</a>

<!-- Сообщения, которые нельзя потерять: показываются поверх любого экрана. -->
<div class="notice" id="notice" role="status" aria-live="polite" hidden></div>

<!-- ───────────────────────── ГЛАВНОЕ МЕНЮ ───────────────────────── -->
<section class="screen screen--menu" id="screen-menu" data-screen="menu">
    <div class="menu-inner">
        <h1 class="title">БИТВА СТИХИЙ</h1>
        <p class="subtitle">Огонь · Вода · Ветер</p>
        <span class="alpha">АЛЬФА-ВЕРСИЯ</span>

        <div class="wheel" id="menu-wheel" aria-label="Колесо стихий"></div>

        <div class="menu-actions">
            <button class="mbtn mbtn--primary" data-goto="story">
                <span class="mbtn-name">СЮЖЕТ</span>
                <span class="mbtn-note">Башня Трёх Стихий · пять противников</span>
            </button>
            <button class="mbtn" data-goto="modes">
                <span class="mbtn-name">СВОБОДНЫЙ БОЙ</span>
                <span class="mbtn-note">Четыре режима, случайный маг</span>
            </button>
            <button class="mbtn" data-goto="learn">
                <span class="mbtn-name">КАК ЭТО РАБОТАЕТ</span>
                <span class="mbtn-note">Правила за минуту</span>
            </button>
        </div>

        <p class="leaders" id="leaders">ГЛОБАЛЬНЫЙ ТОП: —</p>
    </div>
</section>

<!-- ───────────────────────── ВЫБОР РЕЖИМА ───────────────────────── -->
<section class="screen screen--menu" id="screen-modes" data-screen="modes" hidden>
    <div class="menu-inner">
        <h2 class="title title--sm">СВОБОДНЫЙ БОЙ</h2>
        <p class="subtitle">Один бой против случайного мага</p>
        <div class="mode-grid" id="mode-grid"></div>
        <button class="mbtn mbtn--ghost" data-goto="menu">НАЗАД</button>
    </div>
</section>

<!-- ───────────────────────── ОБУЧЕНИЕ ───────────────────────── -->
<section class="screen screen--menu" id="screen-learn" data-screen="learn" hidden>
    <div class="menu-inner learn">
        <div class="learn-progress" id="learn-progress"></div>
        <div class="learn-card" id="learn-card"></div>
        <div class="learn-nav">
            <button class="mbtn mbtn--ghost" id="learn-prev">НАЗАД</button>
            <button class="mbtn mbtn--primary" id="learn-next">ДАЛЬШЕ</button>
        </div>
    </div>
</section>

<!-- ───────────────────────── СЮЖЕТНАЯ ИНТЕРЛЮДИЯ ───────────────────────── -->
<section class="screen screen--menu" id="screen-story" data-screen="story" hidden>
    <div class="menu-inner story">
        <div class="story-tier" id="story-tier"></div>
        <h2 class="title title--sm" id="story-name"></h2>
        <div class="story-portrait" id="story-portrait"></div>
        <p class="story-text" id="story-text"></p>
        <p class="story-hint" id="story-hint"></p>
        <div class="story-track" id="story-track"></div>
        <button class="mbtn mbtn--primary" id="story-go">ДАЛЬШЕ</button>
    </div>
</section>

<!-- ───────────────────────── БОЙ ───────────────────────── -->
<main class="screen screen--battle" id="screen-battle" data-screen="battle" hidden>

    <header class="hud">
        <div class="hud-side hud-side--player">
            <div class="hud-name" id="player-name">ТЫ</div>
            <div class="hp"><div class="hp-fill hp-fill--player" id="player-hp-bar"></div></div>
            <div class="hp-num" id="player-hp-num">10</div>
        </div>
        <div class="hud-center">
            <div class="hud-tier" id="hud-tier">СВОБОДНЫЙ БОЙ</div>
            <div class="hud-round"><span id="hud-round">РАУНД 1</span> · <span id="timer-num">15</span> с</div>
            <div class="battle-tools">
                <button class="tool" id="btn-speed" title="Скорость анимации">СКОРОСТЬ: НОРМА</button>
                <button class="tool" id="btn-rules" title="Правила боя">?</button>
                <button class="tool" id="btn-quit" title="Выйти в меню">✕</button>
            </div>
        </div>
        <div class="hud-side hud-side--enemy">
            <div class="hud-name" id="enemy-name">ПРОТИВНИК</div>
            <div class="hp"><div class="hp-fill hp-fill--enemy" id="enemy-hp-bar"></div></div>
            <div class="hp-num" id="enemy-hp-num">10</div>
        </div>
    </header>

    <div class="battle-layout">
        <div class="arena" id="arena">
            <div class="fighter fighter--player" id="fighter-player"></div>
            <div class="fighter fighter--enemy" id="fighter-enemy"></div>
            <div class="fx-layer" id="fx-layer" aria-hidden="true"></div>
            <div class="caption" id="caption" role="status" aria-live="polite"></div>
            <div class="intel" id="intel" aria-label="Что противник уже показал"></div>
            <div class="showcase-outcome" id="showcase-outcome" role="status" aria-live="polite" hidden>
                <span aria-hidden="true">💧</span>
                <span>Вода тушит огонь<br>Коронка пробита</span>
                <span aria-hidden="true">🔥</span>
            </div>
        </div>

        <!-- Поле ходов занимает средний этаж целиком: разбор боя уехал вниз,
             к кнопкам, и отбирать у поля колонку больше некому. -->
        <div class="middle">
            <div class="board">
                <div class="timer" id="timer" aria-label="Время на ход">
                    <div class="timer-fill" id="timer-fill"></div>
                </div>

                <div class="favour" id="favour" aria-live="polite"></div>

                <div class="lane lane--enemy">
                    <span class="lane-label">ПРОТИВНИК</span>
                    <div class="slots" id="enemy-slots"></div>
                </div>
                <div class="lane lane--player">
                    <span class="lane-label">ТЫ</span>
                    <div class="slots" id="player-slots"></div>
                </div>
            </div>
        </div>

        <!-- Нижний этаж: кнопки слева, разбор боя справа от них. Лог читают
             между раундами, а не во время — сбоку от арены он отбирал ширину
             у драки ради текста, на который в бою не смотрят. -->
        <div class="bottom">
            <div class="controls">
                <div class="coach" id="coach" aria-live="polite"></div>

                <div class="charge" title="Заряд суперудара">
                    <div class="charge-fill" id="charge-fill"></div>
                    <span class="charge-label" id="charge-label">ЗАРЯД 0/3</span>
                </div>

                <div class="cast-row" id="cast-row"></div>
                <div class="action-row">
                    <button class="btn btn--del" id="btn-undo">СТЕРЕТЬ</button>
                    <button class="btn btn--go" id="btn-go">В БОЙ</button>
                    <button class="btn btn--super" id="btn-super" disabled>СУПЕР</button>
                </div>
            </div>

            <aside class="side">
                <div class="log" id="log" role="log" aria-live="polite"></div>
            </aside>
        </div>
    </div>

    <div class="overlay" id="overlay" hidden>
        <div class="overlay-card">
            <img class="overlay-art" id="overlay-art" alt="" hidden>
            <h2 class="overlay-title" id="overlay-title"></h2>
            <p class="overlay-text" id="overlay-text"></p>
            <div class="overlay-actions" id="overlay-actions"></div>
        </div>
    </div>

</main>

<script>
(() => {
  // ../../_games/___НЕ РАБОТАЕТ/bitva-stihiy/src/rules.js
  var ELEMENTS = ["fire", "water", "wind"];
  var ELEMENT = {
    fire: {
      id: "fire",
      glyph: "\u{1F525}",
      name: "\u041E\u0433\u043E\u043D\u044C",
      genitive: "\u043E\u0433\u043D\u044F",
      accusative: "\u043E\u0433\u043E\u043D\u044C",
      beats: "wind",
      color: "#fb923c",
      glow: "#fdba74",
      tone: 300
    },
    water: {
      id: "water",
      glyph: "\u{1F4A7}",
      name: "\u0412\u043E\u0434\u0430",
      genitive: "\u0432\u043E\u0434\u044B",
      accusative: "\u0432\u043E\u0434\u0443",
      beats: "fire",
      color: "#38bdf8",
      glow: "#7dd3fc",
      tone: 440
    },
    wind: {
      id: "wind",
      glyph: "\u{1F32A}",
      name: "\u0412\u0435\u0442\u0435\u0440",
      genitive: "\u0432\u0435\u0442\u0440\u0430",
      accusative: "\u0432\u0435\u0442\u0435\u0440",
      beats: "water",
      color: "#a3e635",
      glow: "#d9f99d",
      tone: 560
    }
  };
  var REASONS = {
    "water:fire": "\u0412\u043E\u0434\u0430 \u0442\u0443\u0448\u0438\u0442 \u043E\u0433\u043E\u043D\u044C",
    "fire:wind": "\u041E\u0433\u043E\u043D\u044C \u0440\u0430\u0437\u0434\u0443\u0432\u0430\u0435\u0442\u0441\u044F \u043D\u0430 \u0432\u0435\u0442\u0440\u0443",
    "wind:water": "\u0412\u0435\u0442\u0435\u0440 \u0440\u0430\u0437\u0433\u043E\u043D\u044F\u0435\u0442 \u0432\u043E\u0434\u0443"
  };
  var VERBS = {
    "water:fire": "\u0442\u0443\u0448\u0438\u0442",
    "fire:wind": "\u043F\u043E\u0436\u0438\u0440\u0430\u0435\u0442",
    "wind:water": "\u0440\u0430\u0437\u0433\u043E\u043D\u044F\u0435\u0442"
  };
  function beats(a, b) {
    return ELEMENT[a]?.beats === b;
  }
  function counterTo(target) {
    return ELEMENTS.find((id) => beats(id, target)) ?? null;
  }
  function preyOf(source) {
    return ELEMENT[source]?.beats ?? null;
  }
  function reasonFor(winner, loser) {
    return REASONS[`${winner}:${loser}`] ?? "";
  }
  function clashPhrase(winner, loser) {
    const verb = VERBS[`${winner}:${loser}`];
    if (!verb) return "";
    return `${ELEMENT[winner].glyph} ${ELEMENT[winner].name} ${verb} ${ELEMENT[loser].glyph} ${ELEMENT[loser].accusative}`;
  }
  function roleOf(move, signature) {
    if (move === signature) return "mirror";
    if (beats(move, signature)) return "answer";
    return "third";
  }
  function elementForRole(role, signature) {
    if (role === "mirror") return signature;
    if (role === "answer") return counterTo(signature);
    return preyOf(signature);
  }
  var WHEEL = ELEMENTS.map((id) => ({
    winner: id,
    loser: ELEMENT[id].beats,
    reason: reasonFor(id, ELEMENT[id].beats)
  }));

  // ../../_games/___НЕ РАБОТАЕТ/bitva-stihiy/src/combos.js
  var COMBO_LENGTH = 3;
  var COMBO_NEEDS = 2;
  var COMBOS = {
    surge: {
      id: "surge",
      name: "\u0412\u0410\u041B",
      shape: "AAA",
      hint: "\u0442\u0440\u0438 \u043E\u0434\u0438\u043D\u0430\u043A\u043E\u0432\u044B\u0445",
      repeats: 3,
      damage: 3,
      charge: 0,
      needs: COMBO_NEEDS,
      describe: (element) => `${ELEMENT[element].glyph} \u0412\u0430\u043B ${ELEMENT[element].genitive}: +3 \u0443\u0440\u043E\u043D\u0430`
    },
    bond: {
      id: "bond",
      name: "\u0421\u0412\u042F\u0417\u041A\u0410",
      shape: "\u0434\u0432\u0435 \u043E\u0434\u0438\u043D\u0430\u043A\u043E\u0432\u044B\u0445",
      hint: "\u0434\u0432\u0435 \u043E\u0434\u0438\u043D\u0430\u043A\u043E\u0432\u044B\u0445 \u0438 \u043E\u0434\u043D\u0430 \u0434\u0440\u0443\u0433\u0430\u044F \u2014 \u0432 \u043B\u044E\u0431\u043E\u043C \u043F\u043E\u0440\u044F\u0434\u043A\u0435",
      repeats: 2,
      damage: 2,
      charge: 0,
      needs: COMBO_NEEDS,
      describe: (element) => `${ELEMENT[element].glyph} \u0421\u0432\u044F\u0437\u043A\u0430 ${ELEMENT[element].genitive}: +2 \u0443\u0440\u043E\u043D\u0430`
    },
    prism: {
      id: "prism",
      name: "\u041F\u0420\u0418\u0417\u041C\u0410",
      shape: "ABC",
      hint: "\u0442\u0440\u0438 \u0440\u0430\u0437\u043D\u044B\u0435",
      repeats: 0,
      damage: 1,
      charge: 1,
      needs: COMBO_NEEDS,
      describe: () => "\u041F\u0440\u0438\u0437\u043C\u0430: +1 \u0443\u0440\u043E\u043D\u0430 \u0438 +1 \u0437\u0430\u0440\u044F\u0434\u0430 \u0437\u0430 \u0442\u043E, \u0447\u0442\u043E \u0442\u0435\u0431\u044F \u043D\u0435 \u043F\u0440\u043E\u0447\u0438\u0442\u0430\u043B\u0438"
    }
  };
  var COMBO_LIST = Object.values(COMBOS);
  function leadOf(a, b, c) {
    if (a === b || a === c) return a;
    if (b === c) return b;
    return null;
  }
  function shapeOf(a, b, c) {
    if (a === b && b === c) return COMBOS.surge;
    if (a === b || b === c || a === c) return COMBOS.bond;
    return COMBOS.prism;
  }
  function findCombo(chain) {
    for (let i = 0; i + COMBO_LENGTH <= chain.length; i += 1) {
      const [a, b, c] = chain.slice(i, i + COMBO_LENGTH);
      if (!a || !b || !c) continue;
      return { combo: shapeOf(a, b, c), at: i, slots: [i, i + 1, i + 2], element: leadOf(a, b, c) };
    }
    return null;
  }
  var OVERHEAT_FROM = 4;
  var OVERHEAT_DAMAGE = { 4: 2, 5: 4 };
  function overheatOf(chain) {
    const counts = {};
    for (const move of chain) {
      if (move) counts[move] = (counts[move] ?? 0) + 1;
    }
    const [element, count] = Object.entries(counts).sort((a, b) => b[1] - a[1])[0] ?? [];
    if (!element || count < OVERHEAT_FROM) return null;
    return { element, count, damage: OVERHEAT_DAMAGE[count] ?? OVERHEAT_DAMAGE[5] };
  }

  // ../../_games/___НЕ РАБОТАЕТ/bitva-stihiy/src/favour.js
  function rollFavour(rng) {
    return ELEMENTS[Math.floor(rng() * ELEMENTS.length) % ELEMENTS.length];
  }
  function isFavoured(combo, favour) {
    return Boolean(combo && favour && combo.element === favour);
  }
  function favourText(favour) {
    if (!favour) return "";
    const el2 = ELEMENT[favour];
    return `${el2.glyph} \u0410\u0420\u0415\u041D\u0410 \u0412 \u0421\u0418\u041B\u0415: ${el2.name.toUpperCase()} \u2014 \u0443\u0437\u043E\u0440 \u043D\u0430 \u043D\u0435\u0439 \u043F\u043B\u0430\u0442\u0438\u0442 \u0432\u0434\u0432\u043E\u0435`;
  }

  // ../../_games/___НЕ РАБОТАЕТ/bitva-stihiy/src/engine.js
  var DEFAULT_HP = 10;
  var DEFAULT_SLOTS = 5;
  var CHARGE_COST = 3;
  var MAX_STUNS_PER_ROUND = 1;
  var RHYTHM_MEMORY = 4;
  var SUPER_MEMORY = 4;
  var ENEMY_MEMORY = 2;
  var HIT = 1;
  var SUPER_HIT = 2;
  var SUPER_FAIL = 2;
  var emptyWins = () => ({ fire: 0, water: 0, wind: 0 });
  function createBattle({
    opponent,
    slots = DEFAULT_SLOTS,
    playerHp = DEFAULT_HP,
    playerMaxHp = DEFAULT_HP,
    charge = 0
  } = {}) {
    const enemyMaxHp = opponent?.hp ?? DEFAULT_HP;
    return {
      opponent: opponent ?? null,
      slots,
      round: 1,
      hp: { player: playerHp, enemy: enemyMaxHp },
      maxHp: { player: playerMaxHp, enemy: enemyMaxHp },
      charge: Math.min(charge, CHARGE_COST),
      superArmed: false,
      stunPending: false,
      history: [],
      wins: emptyWins(),
      // Наблюдения для адаптивного ИИ: сколько коронок противник выбросил
      // и сколько из них игрок пробил. Высокая доля = игрок читает коронку.
      sigSeen: 0,
      sigParried: 0,
      // Сколько раз коронка прошла в игрока. Нужен для разбора после боя:
      // «пропустил трижды — потерял шесть, коронка бьёт вдвое».
      sigCrits: 0,
      // Роли ходов игрока по позициям в цепочке — сырьё для чтения ритма.
      roleRounds: [],
      // Что противник показал в бою. Коронку игрок вычисляет отсюда сам —
      // движок её не подсказывает.
      seen: emptyWins(),
      // Прошлые цепочки противника: без них смену маски посреди раунда
      // и подмену стихии в ярости вывести не из чего.
      enemyRounds: [],
      // В какие слоты игрок ставил суперудар: противник учится их защищать.
      superSlots: [],
      // Где игрок собирал узоры: противник учится ломать их точечно,
      // а не заливать контр-стихией всю цепочку.
      comboSlots: [],
      superSlot: null,
      outcome: null
    };
  }
  var isOver = (state) => state.outcome !== null;
  var canArmSuper = (state) => !state.superArmed && state.charge >= CHARGE_COST && !isOver(state);
  function armSuper(state, slot = 0) {
    if (!canArmSuper(state)) return state;
    if (!Number.isInteger(slot) || slot < 0 || slot >= state.slots) return state;
    return { ...state, superArmed: true, superSlot: slot, charge: 0 };
  }
  function resolveRound(state, playerSeq, enemySeq) {
    if (isOver(state)) return { state, events: [] };
    const next = {
      ...state,
      hp: { ...state.hp },
      wins: { ...state.wins },
      seen: { ...state.seen },
      history: [...state.history, ...playerSeq].slice(-10)
    };
    const roundRoles = [];
    const enemyShown = [];
    const combo = findCombo(playerSeq);
    const overheat = overheatOf(playerSeq);
    let comboWins = 0;
    if (combo) next.comboSlots = [...state.comboSlots, combo.slots].slice(-SUPER_MEMORY);
    const events = [{
      type: "round-start",
      round: state.round,
      slots: state.slots,
      combo: combo && { id: combo.combo.id, name: combo.combo.name, slots: combo.slots, element: combo.element }
    }];
    const dealt = { player: 0, enemy: 0 };
    next.stunBudget = MAX_STUNS_PER_ROUND;
    for (let index = 0; index < state.slots; index += 1) {
      const player = playerSeq[index];
      const planned = enemySeq[index] ?? { element: ELEMENTS[0], signature: false };
      const superHere = next.superArmed && next.superSlot === index;
      const clash2 = resolveClash(next, player, planned, index);
      roundRoles[index] = planned.sig ? roleOf(player, planned.sig) : null;
      if (superHere) next.superSlots = [...next.superSlots, index].slice(-SUPER_MEMORY);
      enemyShown[index] = clash2.enemyCasts ? planned.element : null;
      if (clash2.enemyCasts) next.seen[planned.element] += 1;
      if (clash2.target) {
        next.hp[clash2.target] = Math.max(0, next.hp[clash2.target] - clash2.damage);
        dealt[clash2.target] += clash2.damage;
      }
      if (clash2.target === "enemy") next.wins[player] += 1;
      events.push({
        type: "clash",
        index,
        player,
        enemy: clash2.enemyCasts ? planned.element : null,
        enemyPlanned: planned.element,
        enemySignature: planned.signature,
        outcome: clash2.outcome,
        damage: clash2.damage,
        target: clash2.target,
        parry: clash2.parry,
        phrase: clash2.phrase,
        hp: { ...next.hp },
        charge: next.charge,
        superArmed: next.superArmed,
        stunNext: next.stunPending
      });
      if (next.hp.player <= 0 || next.hp.enemy <= 0) break;
      if (combo && combo.slots.includes(index)) {
        if (clash2.target === "enemy") comboWins += 1;
        if (index === combo.slots.at(-1)) {
          const fired = comboWins >= combo.combo.needs;
          const favoured = isFavoured(combo, next.favour);
          const gain = favoured ? 2 : 1;
          const damage = combo.combo.damage * gain;
          const charge = combo.combo.charge * gain;
          if (fired && damage) {
            next.hp.enemy = Math.max(0, next.hp.enemy - damage);
            dealt.enemy += damage;
          }
          if (fired && charge) {
            next.charge = Math.min(CHARGE_COST, next.charge + charge);
          }
          events.push({
            type: "combo",
            id: combo.combo.id,
            name: combo.combo.name,
            element: combo.element,
            slots: combo.slots,
            fired,
            favoured,
            wins: comboWins,

        }
        pushLog(dom.log, `${event.phrase} \u2212${event.damage}`, "enemy");
        paintAll({ hp: event.hp, charge: app.battle.charge });
        await arena.playOverheat(event);
      } else if (event.type === "ko") {
        await arena.playKo(event.winner);
      } else if (event.type === "round-end") {
        if (app.mode.log === "summary") {
          pushLog(dom.log, `\u0418\u0442\u043E\u0433 \u0440\u0430\u0443\u043D\u0434\u0430: \u0442\u044B \u2212${event.dealt.player}, ${app.opponent.name} \u2212${event.dealt.enemy}.`, "system");
        }
      }
    }
  }
  var SLOT_STATE = {
    win: ["win", "lose"],
    stun: ["stun", "stun"],
    "super-hit": ["super", "lose"],
    "super-fail": ["crit", "super"],
    "super-fizzle": ["super", "draw"],
    crit: ["crit", "win"],
    lose: ["lose", "win"],
    draw: ["draw", "draw"]
  };
  var slotStateFor = (event, side) => (SLOT_STATE[event.outcome] ?? ["draw", "draw"])[side === "player" ? 0 : 1];
  function applyImpact(event) {
    if (event.target === "enemy" && app.shownWins) app.shownWins[event.player] += 1;
    paintAll({ hp: event.hp, charge: event.charge });
    if (app.mode.log === "summary") return;
    const kind = event.target === "enemy" ? "player" : event.target === "player" ? "enemy" : "neutral";
    const hidden = app.mode.log === "muted";
    const amount = hidden || !event.damage ? "" : ` \u2212${event.damage}`;
    pushLog(dom.log, `${event.phrase}${amount}`, event.outcome === "stun" || event.parry ? "system" : kind);
  }
  function finishBattle(winner) {
    stopTimer();
    setControlsEnabled(false);
    const won = winner === "player";
    if (app.story) {
      if (won) {
        app.story.wins = { ...app.battle.wins };
        app.story.charge = app.battle.charge;
        const last = isFinalTier(app.story.index);
        app.story.hp = last ? app.battle.hp.player : healAfterWin(app.battle.hp.player);
        window.umami?.track("tier-cleared", {
          game: LEADERBOARD_GAME,
          tier: app.story.index + 1,
          tier_id: app.opponent.id,
          hp_left: app.story.hp
        });
        showOverlay({
          title: "\u042F\u0420\u0423\u0421 \u0412\u0417\u042F\u0422",
          color: "var(--win)",
          text: `\xAB${app.opponent.defeat}\xBB
${app.opponent.reveal ?? ""}${last ? "" : `
\u0417\u0434\u043E\u0440\u043E\u0432\u044C\u0435 \u0432\u043E\u0441\u0441\u0442\u0430\u043D\u043E\u0432\u043B\u0435\u043D\u043E \u0434\u043E ${app.story.hp}.`}

${signatureReport(app.battle, app.opponent)}`,
          actions: last ? [{ label: "\u0424\u0418\u041D\u0410\u041B", primary: true, onClick: showEpilogue }] : [{ label: "\u0414\u0410\u041B\u042C\u0428\u0415", primary: true, onClick: () => showTier(app.story.index + 1) }]
        });
      } else {
        window.umami?.track("game-finish", {
          game: LEADERBOARD_GAME,
          difficulty: "story",
          result: "loss",
          tier: app.story.index + 1,
          tier_id: app.opponent.id,
          duration_seconds: Math.round((Date.now() - app.startedAt) / 1e3)
        });
        void submitLeaderboard(campaignScore({
          tierIndex: app.story.index,
          cleared: false,
          hp: 0,
          wins: app.battle.wins
        }));
        const retryHp = app.story.hp;
        showOverlay({
          title: "\u041F\u041E\u0420\u0410\u0416\u0415\u041D\u0418\u0415",
          color: "var(--lose)",
          art: "./assets/portrait-hero-down.webp",
          text: `${app.opponent.name} \u0443\u0441\u0442\u043E\u044F\u043B.
${app.opponent.reveal ?? ""}

${signatureReport(app.battle, app.opponent)}`,
          actions: [
            { label: "\u041F\u041E\u0412\u0422\u041E\u0420\u0418\u0422\u042C \u042F\u0420\u0423\u0421", primary: true, onClick: () => {
              app.story.hp = retryHp;
              showTier(app.story.index);
            } },
            { label: "\u041F\u0420\u0410\u0412\u0418\u041B\u0410", onClick: () => goLearn("story") },
            { label: "\u0412 \u041C\u0415\u041D\u042E", onClick: goMenu }
          ]
        });
      }
      return;
    }
    window.umami?.track("game-finish", {
      game: LEADERBOARD_GAME,
      difficulty: app.mode.id,
      result: won ? "win" : "loss",
      duration_seconds: Math.round((Date.now() - app.startedAt) / 1e3)
    });
    if (won) {
      const gestures = Object.values(app.battle.wins).reduce((a, b) => a + b, 0);
      void submitLeaderboard(1e3 + app.battle.hp.player * 100 + gestures * 10);
    }
    showOverlay({
      title: won ? "\u041F\u041E\u0411\u0415\u0414\u0410" : "\u041F\u041E\u0420\u0410\u0416\u0415\u041D\u0418\u0415",
      color: won ? "var(--win)" : "var(--lose)",
      art: won ? null : "./assets/portrait-hero-down.webp",
      text: (won ? `${app.opponent.name} \u043F\u043E\u0432\u0435\u0440\u0436\u0435\u043D. \u041E\u0441\u0442\u0430\u043B\u043E\u0441\u044C \u0437\u0434\u043E\u0440\u043E\u0432\u044C\u044F: ${app.battle.hp.player}.` : `${app.opponent.name} \u043E\u043A\u0430\u0437\u0430\u043B\u0441\u044F \u0431\u044B\u0441\u0442\u0440\u0435\u0435.`) + `
\u0415\u0433\u043E \u043A\u043E\u0440\u043E\u043D\u043A\u0430 \u2014 ${ELEMENT[app.opponent.element].name.toLowerCase()}.

${signatureReport(app.battle, app.opponent)}`,
      actions: [
        { label: "\u0415\u0429\u0401 \u0420\u0410\u0417", primary: true, onClick: () => startFreeBattle(app.mode.id) },
        { label: "\u0412 \u041C\u0415\u041D\u042E", onClick: goMenu }
      ]
    });
  }
  function showOverlay({ title, text, color, actions, art = null }) {
    if (art) {
      dom.overlayArt.src = art;
      dom.overlayArt.hidden = false;
    } else {
      dom.overlayArt.hidden = true;
      dom.overlayArt.removeAttribute("src");
    }
    dom.overlayTitle.textContent = title;
    dom.overlayTitle.style.color = color ?? "var(--text)";
    dom.overlayText.textContent = text ?? "";
    dom.overlayText.style.whiteSpace = "pre-line";
    dom.overlayActions.replaceChildren(
      ...actions.map(({ label, primary, onClick }) => {
        const button = document.createElement("button");
        button.className = primary ? "mbtn mbtn--primary" : "mbtn";
        button.type = "button";
        button.textContent = label;
        button.addEventListener("click", () => {
          hideOverlay();
          onClick();
        });
        return button;
      })
    );
    dom.overlay.hidden = false;
  }
  var hideOverlay = () => {
    dom.overlay.hidden = true;
  };
  var KEY_CODES = {
    Digit1: "fire",
    Digit2: "water",
    Digit3: "wind",
    Numpad1: "fire",
    Numpad2: "water",
    Numpad3: "wind",
    KeyQ: "fire",
    KeyW: "water",
    KeyE: "wind"
  };
  var KEY_CHARS = {
    1: "fire",
    2: "water",
    3: "wind",
    q: "fire",
    w: "water",
    e: "wind",
    \u0439: "fire",
    \u0446: "water",
    \u0443: "wind"
  };
  var elementFromKey = (event) => KEY_CODES[event.code] ?? KEY_CHARS[event.key?.toLowerCase()] ?? null;
  var isKey = (event, code, key) => event.code === code || event.key === key;
  function onKeyDown(event) {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    const battleVisible = !$("screen-battle").hidden && dom.overlay.hidden;
    if (!battleVisible) return;
    const element = elementFromKey(event);
    if (element) {
      event.preventDefault();
      castElement(element);
      return;
    }
    if (isKey(event, "Backspace", "Backspace")) {
      event.preventDefault();
      undoCast();
      return;
    }
    if (isKey(event, "Enter", "Enter")) {
      event.preventDefault();
      void runRound();
      return;
    }
    if (isKey(event, "Space", " ")) {
      event.preventDefault();
      useSuper();
    }
  }
  function blockZoomGestures() {
    for (const type of ["gesturestart", "gesturechange", "gestureend"]) {
      document.addEventListener(type, (event) => event.preventDefault(), { passive: false });
    }
  }
  function boot() {
    blockZoomGestures();
    renderWheel(dom.menuWheel);
    renderCastRow(dom.castRow, castElement);
    renderModes(dom.modeGrid, MODES, MODE_ORDER, startFreeBattle);
    loadSpeed();
    wakeAudioOnInteraction();
    installShowcase({
      app,
      arena,
      dom,
      createBattle,
      resolveRound,
      renderSlots,
      setSlot,
      setHp,
      stopTimer,
      PLAYER_MAX_HP
    });
    document.querySelectorAll("[data-goto]").forEach((node) => {
      node.addEventListener("click", () => {
        const target = node.dataset.goto;
        if (target === "menu") goMenu();
        else if (target === "modes") goModes();
        else if (target === "learn") goLearn("menu");
        else if (target === "story") startStory();
      });
    });
    dom.learnPrev.addEventListener("click", () => {
      if (app.learnStep === 0) {
        showScreen(app.learnReturn);
        return;
      }
      app.learnStep -= 1;
      paintLearn();
    });
    dom.learnNext.addEventListener("click", () => {
      if (app.learnStep === LEARN_STEPS.length - 1) {
        showScreen(app.learnReturn);
        return;
      }
      app.learnStep += 1;
      paintLearn();
    });
    dom.btnUndo.addEventListener("click", undoCast);
    dom.btnGo.addEventListener("click", () => void runRound());
    dom.btnSuper.addEventListener("click", useSuper);
    dom.btnSpeed.addEventListener("click", cycleSpeed);
    dom.btnRules.addEventListener("click", () => goLearn("battle"));
    dom.btnQuit.addEventListener("click", () => {
      if (confirmLeave("\u0432 \u043C\u0435\u043D\u044E")) goMenu();
    });
    document.querySelector(".game-home-menu")?.addEventListener("click", (event) => {
      if (!confirmLeave("\u043D\u0430 \u0433\u043B\u0430\u0432\u043D\u0443\u044E")) event.preventDefault();
    });
    window.addEventListener("keydown", onKeyDown);
    void loadLeaderboard();
    showScreen("menu");
  }
  boot();
})();

</script>
</body>
</html>
