<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNB: Tactical Evolution 2026</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #3b82f6;
            --win: #22c55e; --lose: #ef4444; --stun: #fbbf24;
            --crit: #f43f5e; --special: #a855f7; --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text);
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; margin: 0; min-height: 100vh; overflow-x: hidden;
        }

        #start-menu {
            position: fixed; inset: 0; background: var(--bg); z-index: 500;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
        }
        .difficulty-card {
            background: var(--card); border: 2px solid #334155; padding: 15px;
            border-radius: 12px; width: 320px; cursor: pointer; transition: 0.3s; text-align: center;
        }
        .difficulty-card:hover { border-color: var(--accent); transform: translateY(-3px); }
        .difficulty-card.selected { border-color: var(--win); background: #1e3a3a; }

        .header { text-align: center; width: 100%; max-width: 900px; margin-bottom: 10px; }
        .status-container { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-bottom: 20px; }
        .bar-row { display: flex; justify-content: space-between; width: 100%; }

        .hp-section { width: 45%; text-align: center; }
        .hp-value { font-size: 56px; font-weight: 900; line-height: 1; margin-bottom: 5px; }
        .bar-bg { width: 100%; background: #334155; height: 12px; border-radius: 10px; overflow: hidden; }
        .fill { height: 100%; transition: width 0.4s ease; }

        .main-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; width: 100%; max-width: 1000px; }

        .game-zone {
            background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #334155;
            position: relative; overflow: hidden; min-height: 400px; display: flex; flex-direction: column; justify-content: center;
        }

        /* Боковой блок чата и статистики */
        .side-panel { display: flex; flex-direction: column; gap: 15px; }
        .battle-chat {
            background: #020617; border: 1px solid #1e293b; border-radius: 12px;
            height: 320px; display: flex; flex-direction: column; padding: 10px;
            font-size: 13px; font-family: 'Consolas', monospace;
        }
        .chat-messages { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .stat-panel {
            background: var(--card); border: 1px solid #334155; border-radius: 12px; padding: 10px;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; text-align: center;
        }
        .stat-item { font-size: 12px; color: #94a3b8; }
        .stat-val { font-size: 18px; font-weight: bold; color: var(--text); }

        .msg { padding: 4px 8px; border-radius: 4px; border-left: 3px solid transparent; }
        .msg-p { border-color: var(--win); color: #86efac; }
        .msg-c { border-color: var(--lose); color: #fda4af; }
        .msg-sys { border-color: var(--special); color: #d8b4fe; font-weight: bold; }

        .slots-container { display: flex; flex-direction: column; gap: 10px; }
        .slots { display: flex; gap: 10px; justify-content: center; }
        .slot {
            width: 60px; height: 80px; background: #0f172a; border: 2px dashed #475569;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 28px; transition: 0.2s; position: relative;
        }
        .slot.active-slot { border-color: var(--accent); box-shadow: 0 0 15px var(--accent); transform: scale(1.1); }
        .slot.revealed { border-style: solid; }

        /* Стиль для Фехтования: Слева направо */
        .duel-mode .slots-container { flex-direction: row; justify-content: center; align-items: center; gap: 40px; }
        .duel-mode .slot { width: 120px; height: 160px; font-size: 60px; }
        .duel-label { position: absolute; top: -30px; font-size: 12px; color: #64748b; text-transform: uppercase; }

        .res-win { background: var(--win) !important; border-color: white !important; }
        .res-lose { background: var(--lose) !important; }
        .res-draw { background: #475569 !important; }
        .res-stun { background: var(--stun) !important; color: #000; border-color: white; }
        .super-hit-slot { background: var(--special) !important; border: 3px solid white !important; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .btn { padding: 15px; background: #334155; border: 1px solid #475569; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 20px; }
        .btn:hover:not(:disabled) { border-color: var(--accent); }
        .btn:disabled { opacity: 0.3; }

        #start-btn { background: var(--win); grid-column: span 2; font-size: 16px; text-transform: uppercase; }
        #super-btn { background: var(--special); display: none; }
        #super-btn.available { display: block; }

        #end-screen {
            position: absolute; inset: 0; background: rgba(2, 6, 23, 0.96);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; border-radius: 14px; text-align: center;
        }
    </style>
</head>
<body>

    <div id="start-menu">
        <h1 style="color: var(--accent); margin-bottom: 5px;">KNB: TACTICAL EVOLUTION</h1>
        <div class="difficulty-card" onclick="selectDiff('easy')" id="diff-easy">
            <div style="color: var(--win); font-weight:bold">ЛЕГКИЙ</div>
            <div>5 слотов. Полный лог.</div>
        </div>
        <div class="difficulty-card" onclick="selectDiff('medium')" id="diff-medium">
            <div style="color: var(--stun); font-weight:bold">СРЕДНИЙ</div>
            <div>5 слотов. Скрытый урон.</div>
        </div>
        <div class="difficulty-card" onclick="selectDiff('hard')" id="diff-hard">
            <div style="color: var(--lose); font-weight:bold">СЛОЖНЫЙ</div>
            <div>5 слотов. Мгновенно. Таймер 15с.</div>
        </div>
        <div class="difficulty-card" onclick="selectDiff('duel')" id="diff-duel">
            <div style="color: var(--special); font-weight:bold">ФЕХТОВАНИЕ</div>
            <div>1 слот (Бок о бок). Таймер 10с.</div>
        </div>
        <button id="master-start" class="btn" style="width: 320px; background: var(--accent);" disabled onclick="launchGame()">ИГРАТЬ</button>
    </div>

    <div class="header">
        <div class="status-container">
            <div class="bar-row">
                <div class="hp-section"><div class="hp-value" id="p-hp-v" style="color: var(--win)">10</div><div class="bar-bg"><div id="p-hp-bar" class="fill" style="width: 100%; background: var(--win)"></div></div></div>
                <div style="font-size: 24px; font-weight: 900; align-self: center; opacity: 0.3;">VS</div>
                <div class="hp-section"><div class="hp-value" id="c-hp-v" style="color: var(--lose)">10</div><div class="bar-bg"><div id="c-hp-bar" class="fill" style="width: 100%; background: var(--lose)"></div></div></div>
            </div>
            <div style="width: 100%; height: 6px; background: #1e293b; border-radius: 3px; margin-top: 15px;"><div id="sp-bar" style="height: 100%; width: 0%; background: var(--special); transition: 0.3s;"></div></div>
        </div>
    </div>

    <div class="main-layout">
        <div class="game-zone" id="g-zone">
            <div class="slots-container">
                <div class="slots" id="p-slots">
                    <div class="slot" id="ps0"><span class="duel-label" style="display:none">ИГРОК</span>?</div>
                    <div class="slot" id="ps1">?</div><div class="slot" id="ps2">?</div><div class="slot" id="ps3">?</div><div class="slot" id="ps4">?</div>
                </div>
                <div class="slots" id="c-slots">
                    <div class="slot" id="cs0"><span class="duel-label" style="display:none">БОСС</span>?</div>
                    <div class="slot" id="cs1">?</div><div class="slot" id="cs2">?</div><div class="slot" id="cs3">?</div><div class="slot" id="cs4">?</div>
                </div>
            </div>

            <div class="controls">
                <div class="btn-grid">
                    <button class="btn" onclick="add('🧱')" id="bK">🧱</button>
                    <button class="btn" onclick="add('📄')" id="bB">📄</button>
                    <button class="btn" onclick="add('✂️')" id="bN">✂️</button>
                    <button class="btn" onclick="popMove()" id="bDel" style="font-size:14px">DEL</button>
                </div>
                <div class="btn-grid">
                    <button id="start-btn" class="btn" onclick="runRound()">В БОЙ</button>
                    <button id="super-btn" class="btn" onclick="useSuper()" style="font-size:14px">SUPER</button>
                </div>
            </div>
            <div id="timer-text" style="text-align:center; font-size:24px; margin-top:15px; font-weight:bold; color:var(--accent)">15s</div>
            <div id="end-screen">
                <h1 id="end-res" style="font-size: 48px; margin-bottom: 5px;"></h1>
                <button class="btn" style="background:var(--accent); padding: 15px 40px;" onclick="location.reload()">РЕСТАРТ</button>
            </div>
        </div>

        <div class="side-panel">
            <div class="battle-chat"><div class="chat-messages" id="chat"></div></div>
            <div class="stat-panel">
                <div class="stat-item"><div class="stat-val" id="win-k">0</div>🧱</div>
                <div class="stat-item"><div class="stat-val" id="win-b">0</div>📄</div>
                <div class="stat-item"><div class="stat-val" id="win-n">0</div>✂️</div>
            </div>
        </div>
    </div>

<script>
    const WIN_MAP = { '🧱': '✂️', '📄': '🧱', '✂️': '📄' };
    const CNTR = { '🧱': '📄', '📄': '✂️', '✂️': '🧱' };
    const BOSSES = [{n:'КАМЕНЩИК', c:'🧱'}, {n:'ПИСАРЬ', c:'📄'}, {n:'СТРИГАЛЬ', c:'✂️'}];

    let pHP = 10, cHP = 10, sp = 0, diff = 'easy';
    let pSeq = [], history = [], winStats = {'🧱': 0, '📄': 0, '✂️': 0};
    let curBoss = null, superOn = false, running = false, stunNext = false;
    let t = 15, timer, isResting = false, maxSlots = 5;

    function selectDiff(d) {
        diff = d;
        document.querySelectorAll('.difficulty-card').forEach(c => c.classList.remove('selected'));
        document.getElementById('diff-'+d).classList.add('selected');
        document.getElementById('master-start').disabled = false;
    }

    function launchGame() {
        document.getElementById('start-menu').style.display = 'none';
        curBoss = BOSSES[Math.floor(Math.random()*3)];
        if (diff === 'duel') {
            maxSlots = 1;
            document.getElementById('g-zone').classList.add('duel-mode');
            document.querySelectorAll('.duel-label').forEach(l => l.style.display = 'block');
            for(let i=1; i<5; i++) {
                document.getElementById('ps'+i).style.display = 'none';
                document.getElementById('cs'+i).style.display = 'none';
            }
        }
        startTimer();
    }

    function log(txt, type) {
        if (type === 'sys') { renderLog(txt, type); return; }
        if (diff === 'hard') return;
        if (diff === 'medium') txt = txt.replace(/[-]?\d+dmg/g, "").replace(/[-]?\d+ HP/g, "").trim();
        renderLog(txt, type);
    }

    function renderLog(txt, type) {
        const c = document.getElementById('chat');
        const d = document.createElement('div');
        d.className = 'msg msg-' + type; d.innerText = '> ' + txt;
        c.appendChild(d); c.scrollTop = c.scrollHeight;
    }

    function updateWinStats(gesture) {
        winStats[gesture]++;
        document.getElementById('win-k').innerText = winStats['🧱'];
        document.getElementById('win-b').innerText = winStats['📄'];
        document.getElementById('win-n').innerText = winStats['✂️'];
    }

    function add(m) {
        if (isResting) { isResting = false; pSeq = []; updateSlots(); }
        if (pSeq.length < maxSlots) {
            pSeq.push(m); history.push(m);
            if (history.length > 10) history.shift();
            updateSlots();
            if (pSeq.length === maxSlots) runRound();
        }
    }

    function popMove() { pSeq.pop(); updateSlots(); }

    function updateSlots() {
        for(let i=0; i<maxSlots; i++) {
            const ps = document.getElementById('ps'+i), cs = document.getElementById('cs'+i);
            ps.childNodes[ps.childNodes.length-1].nodeValue = pSeq[i] || '?';
            ps.className = pSeq[i] ? 'slot revealed' : 'slot';
            if (!isResting) { cs.childNodes[cs.childNodes.length-1].nodeValue = '?'; cs.className = 'slot'; }
        }
    }

    function useSuper() {
        superOn = true; sp = 0; updateStatus();
        document.getElementById('super-btn').classList.remove('available');
        log("СУПЕРУДАР ЗАРЯЖЕН!", "sys");
    }

    function runRound() {
        if (running) return;
        running = true; clearInterval(timer); toggleBtns(true);
        while(pSeq.length < maxSlots) pSeq.push(['🧱','📄','✂️'][Math.floor(Math.random()*3)]);
        updateSlots();

        let counts = history.reduce((a,b)=>{a[b]=(a[b]||0)+1; return a},{});
        let counter = (history.length >= 6 && Object.values(counts).some(v=>v>=history.length*0.7)) ? CNTR[history[history.length-1]] : null;

        let cSeq = [];
        for(let i=0; i<maxSlots; i++) {
            let m = counter || (Math.random() < 0.7 ? curBoss.c : ['🧱','📄','✂️'].filter(x=>x!==curBoss.c)[Math.floor(Math.random()*2)]);
            cSeq.push({ m, isC: m === curBoss.c && !counter });
        }

        if (diff === 'hard') {
            let pS = pHP, cS = cHP;
            for(let i=0; i<5; i++) {
                let r = calcHit(pSeq[i], cSeq[i], i);
                document.getElementById('cs'+i).childNodes[document.getElementById('cs'+i).childNodes.length-1].nodeValue = cSeq[i].m;
                document.getElementById('cs'+i).classList.add('revealed');
                if (r === 'win' || r === 's-hit' || r === 'stun') updateWinStats(pSeq[i]);
            }
            log(`ИТОГ: Игрок -${pS - pHP}, Босс -${cS - cHP}`, "sys");
            updateStatus(); setTimeout(endRound, 800);
        } else {
            processStep(0, cSeq);
        }
    }

    function processStep(i, cSeq) {
        if (i >= maxSlots || pHP <= 0 || cHP <= 0) return endRound();
        const ps = document.getElementById('ps'+i), cs = document.getElementById('cs'+i);
        ps.classList.add('active-slot'); cs.classList.add('active-slot');
        setTimeout(() => {
            let res = calcHit(pSeq[i], cSeq[i], i);
            if (res === 'win' || res === 's-hit' || res === 'stun') updateWinStats(pSeq[i]);
            applyVisuals(i, res, cSeq[i].m);
            setTimeout(() => {
                ps.classList.remove('active-slot'); cs.classList.remove('active-slot');
                processStep(i + 1, cSeq);
            }, 600);
        }, 400);
    }

    function calcHit(p, cO, idx) {
        if (stunNext) { cHP--; stunNext = false; return 'stun'; }
        if (superOn && idx === 0) {
            superOn = false;
            if (WIN_MAP[p] === cO.m) { cHP -= 2; return 's-hit'; }
            else { pHP -= 2; return 's-fail'; }
        }
        if (p === cO.m) return 'draw';
        if (WIN_MAP[p] === cO.m) { cHP -= 1; if (cO.isC) { sp++; stunNext = true; } return 'win'; }
        pHP -= (cO.isC ? 2 : 1); return cO.isC ? 'crit' : 'lose';
    }

    function applyVisuals(i, res, m) {
        const ps = document.getElementById('ps'+i), cs = document.getElementById('cs'+i);
        cs.childNodes[cs.childNodes.length-1].nodeValue = m; cs.classList.add('revealed');
        if (res === 'stun' || res === 'win' || res === 's-hit') ps.classList.add(res==='s-hit'?'super-hit-slot':'res-win');
        else if (res === 'draw') ps.classList.add('res-draw');
        else ps.classList.add('res-lose');

        if (res === 'stun') log("Удар (оглушение)", "p");
        else if (res === 's-hit') log("⚡ СУПЕРУДАР!", "sys");
        else if (res === 'win') log("Игрок нанес 1dmg", "p");
        else if (res === 'draw') log("Ничья", "sys");
        else if (res === 'crit') log("КРИТ БОССА -2dmg!", "c");
        else log("Босс нанес 1dmg", "c");
        updateStatus();
    }

    function updateStatus() {
        pHP = Math.max(0, pHP); cHP = Math.max(0, cHP);
        document.getElementById('p-hp-v').innerText = pHP; document.getElementById('c-hp-v').innerText = cHP;
        document.getElementById('p-hp-bar').style.width = (pHP*10)+'%'; document.getElementById('c-hp-bar').style.width = (cHP*10)+'%';
        document.getElementById('sp-bar').style.width = (sp*33.3)+'%';
        if (sp >= 3) document.getElementById('super-btn').classList.add('available');
    }

    function endRound() {
        running = false; isResting = true;
        if (pHP <= 0 || cHP <= 0) {
            document.getElementById('end-screen').style.display = 'flex';
            document.getElementById('end-res').innerText = pHP > 0 ? "ПОБЕДА" : "ПОТРАЧЕНО";
            document.getElementById('end-res').style.color = pHP > 0 ? "var(--win)" : "var(--lose)";
        } else { toggleBtns(false); startTimer(); if (diff === 'duel') pSeq = []; }
    }

    function startTimer() {
        t = (diff === 'duel') ? 10 : 15; clearInterval(timer);
        document.getElementById('timer-text').innerText = t + "s";
        timer = setInterval(() => { t--; document.getElementById('timer-text').innerText = t + "s"; if (t <= 0) runRound(); }, 1000);
    }

    function toggleBtns(s) { ['bK','bB','bN','bDel','start-btn'].forEach(id => document.getElementById(id).disabled = s); }
</script>
</body>
</html>
